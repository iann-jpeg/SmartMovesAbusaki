services:
  - type: web
    name: smartmoves-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: smartmoves
      - key: CLIENT_ORIGIN
        value: https://smart-moves-abusaki.vercel.app
      - key: ADMIN_TOKEN
        sync: false
